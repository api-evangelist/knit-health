aid: knit-health
name: Knit Health
description: 'Knit Health Technologies, Inc. is a healthcare AI company spun out of
  the University of California, Berkeley, building what it calls a Large Clinical Behavior
  Model (LCBM) — a healthcare-native intelligence layer trained on real clinical decision
  patterns rather than text alone. Where conventional clinical AI is built on large
  language models trained on medical literature, Knit learns from the actions of practicing
  clinicians captured in electronic medical records: referral decisions, scheduling
  behavior, patient routing, discharge timing, and care coordination. The model is
  trained on Truveta EMR data representing more than 130 million patients across 30
  U.S. health systems, using deep reinforcement learning, causal inference, and behavioral
  cloning, then fine-tuned to an individual health system''s own practice patterns.
  Knit sells to health systems as an enterprise intelligence platform spanning intelligent
  specialist routing, predictive patient flow, optimized care team allocation, clinical
  variation insight, and proactive care recommendations. The company launched from
  stealth in May 2026 with an $11.6M seed round co-led by Uncork Capital and Frist
  Cressey Ventures, following a pre-seed led by Moxxie Ventures with Coalition Operators.
  Knit states that its engineers work alongside customer teams to design and deploy
  APIs tailored to each health system; as of this profile there is no public developer
  portal, API documentation, or self-serve API surface.'
